server:
  port: 8080
  error:
    include-stacktrace: always
    include-message: always
    include-exception: true
  servlet:
    session:
      cookie:
        name: PVSESSION
        http-only: false
        secure: false
        same-site: lax
      timeout: 30d
      persistent: true
  tomcat:
    max-http-form-post-size: 50MB

spring:
  application:
    name: punto-venta-backend

  datasource:
    url: jdbc:mysql://mysql:3306/punto_venta?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    format-sql: true
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  security:
    user:
      name: root
      password: root

